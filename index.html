<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Do The Right Thing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="scene">

  <!-- Notebook container — image + overlay are co-located -->
  <div class="notebook-wrap">
    <img class="notebook-img" id="notebook-img" src="photo_assetts/Notebook.png" alt="Open notebook">

    <div class="notebook-overlay" id="notebook-overlay">

      <!-- Left page container (overflow:hidden — nothing escapes) -->
      <div class="nb-page nb-page-left">

        <div class="nb-item title-item" id="title-item" data-href="#">
          <img src="photo_assetts/Title_Transparent.png" alt="Just Do The Right Thing">
        </div>

      </div><!-- /.nb-page-left -->

      <!-- Right page container -->
      <div class="nb-page nb-page-right">

      </div><!-- /.nb-page-right -->

    </div><!-- /.notebook-overlay -->
  </div><!-- /.notebook-wrap -->


</div>

<script src="script.js"></script>
</body>
</html>
