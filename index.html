<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Do The Right Thing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="scene">

  <!-- Notebook background -->
  <div class="notebook-wrap">
    <img class="notebook-img" id="notebook-img" src="photo_assetts/Notebook.png" alt="Open notebook">
  </div>

  <!-- Overlay — JS sizes/positions this to match the rendered notebook image exactly -->
  <div class="notebook-overlay" id="notebook-overlay">

    <!-- Left page container (overflow:hidden — nothing escapes) -->
    <div class="nb-page nb-page-left">

      <div class="nb-item title-item" data-href="#">
        <img src="photo_assetts/Title_Transparent.png" alt="Just Do The Right Thing">
      </div>

      <div class="nb-item stars-item">
        <img src="photo_assetts/Star_Sticker.png" alt="">
      </div>

      <div class="nb-item ella-polaroid nb-polaroid" data-href="#">
        <div class="polaroid-photo"><span class="no-asset-label">no asset</span></div>
        <p class="polaroid-name">Ella</p>
      </div>

      <div class="nb-item brie-polaroid nb-polaroid" data-href="#">
        <div class="polaroid-photo"><span class="no-asset-label">no asset</span></div>
        <p class="polaroid-name">Brianna</p>
      </div>

      <div class="nb-item stanford-item" data-href="#">
        <img src="photo_assetts/Stanford.png" alt="Stanford">
      </div>

      <div class="nb-item about-item" data-href="#">About</div>

      <div class="nb-item radio-item" data-href="#">
        <img src="photo_assetts/Radio_Sticker.png" alt="Tune in">
        <p class="tune-in">Tune in!</p>
      </div>

    </div><!-- /.nb-page-left -->

    <!-- Right page container -->
    <div class="nb-page nb-page-right">

      <div class="nb-item film-item" data-href="#">
        <img src="photo_assetts/Film_Frame.png" alt="Episode">
      </div>

      <div class="nb-item platform-item" data-href="#">
        <img src="photo_assetts/Platform_Icon.png" alt="Listen">
      </div>

      <div class="nb-item vibecheck-item" data-href="#">
        <img src="photo_assetts/VibeCheck_NoClip.png" alt="Vibe Check">
      </div>

      <div class="nb-item bynumbers-item" data-href="#">
        <span class="no-asset-label">no asset</span>
      </div>

    </div><!-- /.nb-page-right -->

  </div><!-- /.notebook-overlay -->

  <!-- Flip leaf -->
  <div class="flip-leaf" id="flip-leaf" aria-hidden="true">
    <div class="flip-face flip-front"></div>
    <div class="flip-face flip-back"></div>
  </div>

  <!-- Navigation -->
  <nav class="flip-nav" id="flip-nav">
    <button class="nav-btn" id="btn-prev" disabled>&#8592;</button>
    <span class="page-num" id="page-num">1</span>
    <button class="nav-btn" id="btn-next">&#8594;</button>
  </nav>

</div>

<script src="script.js"></script>
</body>
</html>
