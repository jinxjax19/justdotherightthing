<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Do The Right Thing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="scene">

  <!-- Notebook background -->
  <div class="notebook-wrap">
    <img class="notebook-img" id="notebook-img" src="photo_assetts/Notebook.png" alt="Open notebook">
  </div>

  <!-- Overlay — JS sizes/positions this to match the rendered notebook image exactly -->
  <div class="notebook-overlay" id="notebook-overlay">

    <!-- Left page container (overflow:hidden — nothing escapes) -->
    <div class="nb-page nb-page-left">

    </div><!-- /.nb-page-left -->

    <!-- Right page container -->
    <div class="nb-page nb-page-right">

    </div><!-- /.nb-page-right -->

  </div><!-- /.notebook-overlay -->


</div>

<script src="script.js"></script>
</body>
</html>
