<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Do The Right Thing</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @font-face {
      font-family: 'TheGirlNextDoor';
      src: url('assetts/The_Girl_Next_Door/TheGirlNextDoor-Regular.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Chicle';
      src: url('assetts/Chicle/Chicle-Regular.ttf') format('truetype');
    }

    .home-episodes-header {
      position: absolute;
      top: -2%;
      left: 10%;
      width: 70%;
      pointer-events: none;
    }
    .home-episodes-header img {
      width: 100%;
      display: block;
    }

.home-tagline {
      position: absolute;
      top: 28%;
      left: 14%;
      width: 80%;
      font-family: 'TheGirlNextDoor', cursive;
      font-size: 20px;
      color: #333;
      line-height: 1.7;
      pointer-events: none;
    }

    /* Outer group — horizontal flex row, stars left of title */
    .home-ep1-group {
      position: absolute;
      top: 25%;
      left: -4%;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0%;
    }

    /* Stars — more specific selector beats the global .nb-item img { width:100% } */
    .home-ep1-group img.home-ep1-stars {
      width: 25%;
      flex-shrink: 0;
      display: block;
    }

    /* Title text — left-justified, takes remaining space */
    .home-ep1-title {
      font-family: 'Chicle', cursive;
      font-size: 2.7cqw;
      color: #8b1a1a;
      line-height: 1.3;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="scene">

  <!-- Notebook container — image + overlay are co-located -->
  <div class="notebook-wrap">
    <img class="notebook-img" id="notebook-img" src="assetts/Notebook.png" alt="Open notebook">

    <div class="notebook-overlay" id="notebook-overlay">

      <!-- Left page container (overflow:hidden — nothing escapes) -->
      <div class="nb-page nb-page-left">

        <div class="nb-item title-item" id="title-item" data-href="#">
          <img src="assetts/Title_New.png" alt="Just Do The Right Thing">
        </div>

        <p class="home-tagline">We're here to fill you in on the latest city hall drama. From one bestie to another.</p>

        <!-- Both polaroids grouped — hover and click as one unit -->
        <div class="nb-item team-polaroid-group" data-href="team.html">
          <div class="ella-polaroid">
            <img src="assetts/Ella.PNG" alt="Ella">
          </div>
          <div class="brie-polaroid">
            <img src="assetts/Brie.PNG" alt="Brianna">
          </div>
        </div>

        <div class="nb-item stanford-item" data-href="about.html">
          <img src="assetts/Stanford2.PNG" alt="Stanford">
        </div>

      </div><!-- /.nb-page-left -->

      <!-- Right page container -->
      <div class="nb-page nb-page-right">

        <div class="home-episodes-header">
          <img src="assetts/Episodes.png" alt="Episodes">
        </div>

        <!-- Stars + title grouped as one clickable unit linking to episode 1 -->
        <div class="nb-item home-ep1-group" data-href="episode1.html">
          <img src="assetts/Star_Sticker.png" alt="" class="home-ep1-stars">
          <div class="home-ep1-title">
            San Mateo: Surveillance, Fraud, and Bikers - Oh My!
          </div>
        </div>

        <div class="nb-item radio-item" data-href="episode1.html">
          <img src="assetts/Radio_Sticker.png" alt="Tune in">
          <p class="tune-in">See where the radio takes you!</p>
        </div>

      </div><!-- /.nb-page-right -->

    </div><!-- /.notebook-overlay -->
  </div><!-- /.notebook-wrap -->

  <!-- Tea sits on the wood, outside the notebook -->
  <a href="index.html"><img src="assetts/Tea.png" alt="Tea" class="blanket-item tea-item"></a>

</div>

<script src="script.js"></script>
</body>
</html>
